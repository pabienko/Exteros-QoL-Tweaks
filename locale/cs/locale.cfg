[mod-name]
Exteros-QoL-Tweaks=Exteros' Tweaks

[mod-description]
Exteros-QoL-Tweaks=Samostatný mód s úpravami: parametry paliv, návratnost recyklace pro točení kvality a nabíjení roboportů. Nahrazuje módy Adjustable Fuel Stats a Adjustable Recycler; nic se nezmění, dokud nezapneš přepínač.

[mod-setting-name]
exteros-tweaks-fuel-stats-enabled=[item=iron-gear-wheel] [color=#84CDEC]Zapnout Fuel Stats[/color]
exteros-tweaks-recycler-return-enabled=[item=iron-gear-wheel] [color=#84CDEC]Zapnout Recycler Return Rate[/color]
exteros-tweaks-roboports-enabled=[item=iron-gear-wheel] [color=#84CDEC]Zapnout Roboports[/color]
exteros-tweaks-roboports-charging-quality-scaling=[color=#8FD18F][font=default-bold]Roboports[/font][/color]: Nabíjecí stanice škálují s kvalitou
exteros-tweaks-roboports-charging-speed-multiplier=[color=#8FD18F][font=default-bold]Roboports[/font][/color]: Násobič rychlosti nabíjení
exteros-tweaks-recycler-return-rate=[img=utility/any_quality] [color=#8FD18F][font=default-bold]Recycler Return Rate[/font][/color]: Návratnost (%)
exteros-tweaks-recycler-return-scope=[img=utility/any_quality] [color=#8FD18F][font=default-bold]Recycler Return Rate[/font][/color]: Rozsah

[mod-setting-description]
exteros-tweaks-fuel-stats-enabled=Zapne nastavení parametrů paliv níže (výhřevnost, zrychlení, max. rychlost).
exteros-tweaks-recycler-return-enabled=Povolí nastavení návratnosti recyklace níže. Nic se nezmění, dokud toto nezapneš.
exteros-tweaks-roboports-enabled=Povolí nastavení nabíjení roboportů níže. Nic se nezmění, dokud toto nezapneš.
exteros-tweaks-roboports-charging-quality-scaling=Počet nabíjecích stanic škáluje s kvalitou, podobně jako vyšší kvalita už dává víc slotů pro roboty a materiál. (Vyžaduje Zapnout Roboports)
exteros-tweaks-roboports-charging-speed-multiplier=Násobí nabíjecí výkon každého roboportu a osobního roboportu, navrch k bonusu, který už dává vanilla kvalita. (Vyžaduje Zapnout Roboports)
exteros-tweaks-recycler-return-rate=Kolik recyklátor vrátí, v procentech (ve vanilla hře 25). Ovlivněné recepty určuje nastavení Rozsah níže; šrot se nemění nikdy. (Vyžaduje Zapnout Recycler Return Rate)
exteros-tweaks-recycler-return-scope=Na které recyklační recepty se návratnost vztahuje: jen sám na sebe (pláty, plast, …), nebo všechny recepty kromě šrotu. (Vyžaduje Zapnout Recycler Return Rate)

[string-mod-setting]
exteros-tweaks-recycler-return-scope-self-only=Jen sám na sebe
exteros-tweaks-recycler-return-scope-all=Všechny recepty (kromě šrotu)

