fuel-accel-name-space-age=[img=utility/space_age_icon] [color=#8FD18F][font=default-bold]Fuel Stats[/font][/color]: __1__ zrychlení
fuel-speed-name-space-age=[img=utility/space_age_icon] [color=#8FD18F][font=default-bold]Fuel Stats[/font][/color]: __1__ max. rychlost
fuel-energy-description=Výhřevnost __1__ v MJ. Ve vanilla hře: __2__. (Vyžaduje Zapnout Fuel Stats)
fuel-accel-description=Násobič zrychlení vozidla při spalování __1__. Ve vanilla hře: __2__. (Vyžaduje Zapnout Fuel Stats)
fuel-speed-description=Násobič maximální rychlosti vozidla při spalování __1__. Ve vanilla hře: __2__. (Vyžaduje Zapnout Fuel Stats)
