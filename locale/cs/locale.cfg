[mod-name]
Exteros-QoL-Tweaks=Exteros QoL System - Tweaky

[mod-description]
Exteros-QoL-Tweaks=Doplňkové úpravy k Exteros' QoL System: parametry paliv (výhřevnost, zrychlení, max. rychlost), návratnost recyklace pro točení kvality a úpravy nabíjení roboportů (nabíjecí stanice škálující s kvalitou, upravitelná rychlost nabíjení). Nahrazuje módy Adjustable Fuel Stats a Adjustable Recycler. Nic se nezmění, dokud nezapneš příslušný přepínač.

[mod-setting-name]
exteros-qol-tweaks-fuel-stats-enabled=[item=iron-gear-wheel] [color=#84CDEC]Zapnout Fuel Stats[/color]
exteros-qol-tweaks-recycler-return-enabled=[item=iron-gear-wheel] [color=#84CDEC]Zapnout Recycler Return Rate[/color]
exteros-qol-tweaks-roboports-enabled=[item=iron-gear-wheel] [color=#84CDEC]Zapnout Roboports[/color]
exteros-qol-tweaks-roboport-charging-quality-scaling=[color=#8FD18F][font=default-bold]Roboports[/font][/color]: Nabíjecí stanice škálují s kvalitou
exteros-qol-tweaks-roboport-charging-speed-multiplier=[color=#8FD18F][font=default-bold]Roboports[/font][/color]: Násobič rychlosti nabíjení
exteros-qol-cheat-recycler-return-rate=[img=utility/any_quality] [color=#8FD18F][font=default-bold]Recycler Return Rate[/font][/color]: Návratnost (%)
exteros-qol-cheat-recycler-scope=[img=utility/any_quality] [color=#8FD18F][font=default-bold]Recycler Return Rate[/font][/color]: Rozsah

[mod-setting-description]
exteros-qol-tweaks-fuel-stats-enabled=Povolí nastavení parametrů paliv níže (výhřevnost, zrychlení, max. rychlost). Nic se nezmění, dokud toto nezapneš.
exteros-qol-tweaks-recycler-return-enabled=Povolí nastavení návratnosti recyklace níže. Nic se nezmění, dokud toto nezapneš.
exteros-qol-tweaks-roboports-enabled=Povolí nastavení nabíjení roboportů níže. Nic se nezmění, dokud toto nezapneš.
exteros-qol-tweaks-roboport-charging-quality-scaling=Počet nabíjecích stanic každého roboportu a osobního roboportu bude škálovat s jeho kvalitou, stejně jako vyšší kvalita už dnes dává víc slotů pro roboty a materiál. (Vyžaduje Zapnout Roboports)
exteros-qol-tweaks-roboport-charging-speed-multiplier=Násobí nabíjecí výkon každého roboportu a osobního roboportu. Vanilla kvalita už sama o sobě zvyšuje rychlost nabíjení za úroveň; tohle se na ni přidává navrch. (Vyžaduje Zapnout Roboports)
exteros-qol-cheat-recycler-return-rate=Kolik recyklátor vrátí, v procentech. Ve vanilla hře 25. Které recepty to ovlivní, určuje Rozsah návratnosti recyklace; šrot se nemění nikdy. (Vyžaduje Zapnout Recycler Return Rate)
exteros-qol-cheat-recycler-scope=Na které recyklační recepty se návratnost vztahuje. Jen sám na sebe: předměty, které se recyklují samy na sebe (pláty, plast, …). Všechny recepty: každý recyklační recept kromě šrotu. (Vyžaduje Zapnout Recycler Return Rate)

[string-mod-setting]
exteros-qol-cheat-recycler-scope-self-only=Jen sám na sebe
exteros-qol-cheat-recycler-scope-all=Všechny recepty (kromě šrotu)

