[mod-name]
Exteros-QoL-Tweaks=Exteros QoL System - Tweaks

[mod-description]
Exteros-QoL-Tweaks=Tweak addon for Exteros' QoL System: fuel stats (fuel value, acceleration, top speed), recycler return rate for quality upcycling, and roboport charging tweaks (quality-scaled charging stations, adjustable charging speed). Replaces Adjustable Fuel Stats and Adjustable Recycler. Nothing changes until you enable a feature's switch.

[mod-setting-name]
exteros-qol-tweaks-fuel-stats-enabled=[item=iron-gear-wheel] [color=#84CDEC]Enable Fuel Stats[/color]
exteros-qol-tweaks-recycler-return-enabled=[item=iron-gear-wheel] [color=#84CDEC]Enable Recycler Return Rate[/color]
exteros-qol-tweaks-roboports-enabled=[item=iron-gear-wheel] [color=#84CDEC]Enable Roboports[/color]
exteros-qol-tweaks-roboport-charging-quality-scaling=[color=#8FD18F][font=default-bold]Roboports[/font][/color]: Charging stations scale with quality
exteros-qol-tweaks-roboport-charging-speed-multiplier=[color=#8FD18F][font=default-bold]Roboports[/font][/color]: Charging speed multiplier
exteros-qol-cheat-recycler-return-rate=[img=utility/any_quality] [color=#8FD18F][font=default-bold]Recycler Return Rate[/font][/color]: Rate (%)
exteros-qol-cheat-recycler-scope=[img=utility/any_quality] [color=#8FD18F][font=default-bold]Recycler Return Rate[/font][/color]: Scope

[mod-setting-description]
exteros-qol-tweaks-fuel-stats-enabled=Enables the fuel stats settings below (fuel value, acceleration, top speed). Nothing changes until this is on.
exteros-qol-tweaks-recycler-return-enabled=Enables the recycler return rate settings below. Nothing changes until this is on.
exteros-qol-tweaks-roboports-enabled=Enables the roboport charging settings below. Nothing changes until this is on.
exteros-qol-tweaks-roboport-charging-quality-scaling=Makes every roboport's and personal roboport's charging station count scale with its quality level, same as higher-quality roboports already get more robot and material slots. (Requires Enable Roboports)
exteros-qol-tweaks-roboport-charging-speed-multiplier=Multiplies the charging power of every roboport and personal roboport. Vanilla quality already adds charging speed per level; this stacks on top of that. (Requires Enable Roboports)
exteros-qol-cheat-recycler-return-rate=How much the recycler gives back, in percent. Vanilla is 25. Which recipes it affects is set by the Scope setting below; scrap is never affected. (Requires Enable Recycler Return Rate)
exteros-qol-cheat-recycler-scope=Which recycling recipes the return rate applies to. Self-recycling only: items that recycle into themselves (plates, plastic, …). All recipes: every recycling recipe except scrap. (Requires Enable Recycler Return Rate)

[string-mod-setting]
exteros-qol-cheat-recycler-scope-self-only=Self-recycling only
exteros-qol-cheat-recycler-scope-all=All recipes (except scrap)

