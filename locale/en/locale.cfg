[mod-name]
Exteros-QoL-Tweaks=Exteros' Tweaks

[mod-description]
Exteros-QoL-Tweaks=Standalone tweaks mod: fuel stats, recycler return rate for quality upcycling, and roboport charging. Replaces Adjustable Fuel Stats and Adjustable Recycler; nothing changes until you flip a switch.

[mod-setting-name]
exteros-tweaks-fuel-stats-enabled=[item=iron-gear-wheel] [color=#84CDEC]Enable Fuel Stats[/color]
exteros-tweaks-recycler-return-enabled=[item=iron-gear-wheel] [color=#84CDEC]Enable Recycler Return Rate[/color]
exteros-tweaks-roboports-enabled=[item=iron-gear-wheel] [color=#84CDEC]Enable Roboports[/color]
exteros-tweaks-roboports-charging-quality-scaling=[color=#8FD18F][font=default-bold]Roboports[/font][/color]: Charging stations scale with quality
exteros-tweaks-roboports-charging-speed-multiplier=[color=#8FD18F][font=default-bold]Roboports[/font][/color]: Charging speed multiplier
exteros-tweaks-recycler-return-rate=[img=utility/any_quality] [color=#8FD18F][font=default-bold]Recycler Return Rate[/font][/color]: Rate (%)
exteros-tweaks-recycler-return-scope=[img=utility/any_quality] [color=#8FD18F][font=default-bold]Recycler Return Rate[/font][/color]: Scope

[mod-setting-description]
exteros-tweaks-fuel-stats-enabled=Turns on the fuel stats settings below (fuel value, acceleration, top speed).
exteros-tweaks-recycler-return-enabled=Enables the recycler return rate settings below. Nothing changes until this is on.
exteros-tweaks-roboports-enabled=Enables the roboport charging settings below. Nothing changes until this is on.
exteros-tweaks-roboports-charging-quality-scaling=Charging station count scales with quality, like higher-quality roboports already get more robot/material slots. (Requires Enable Roboports)
exteros-tweaks-roboports-charging-speed-multiplier=Multiplies the charging power of every roboport and personal roboport, stacking on top of vanilla quality's own charging speed bonus. (Requires Enable Roboports)
exteros-tweaks-recycler-return-rate=How much the recycler gives back, in percent (vanilla 25). Affected recipes are set by Scope below; scrap is never affected. (Requires Enable Recycler Return Rate)
exteros-tweaks-recycler-return-scope=Which recycling recipes the return rate applies to: self-recycling only (plates, plastic, …) or all recipes except scrap. (Requires Enable Recycler Return Rate)

[string-mod-setting]
exteros-tweaks-recycler-return-scope-self-only=Self-recycling only
exteros-tweaks-recycler-return-scope-all=All recipes (except scrap)

[exteros-tweaks]
fuel-energy-name=[color=#8FD18F][font=default-bold]Fuel Stats[/font][/color]: __1__ energy (MJ)
fuel-accel-name=[color=#8FD18F][font=default-bold]Fuel Stats[/font][/color]: __1__ acceleration
fuel-speed-name=[color=#8FD18F][font=default-bold]Fuel Stats[/font][/color]: __1__ top speed
fuel-energy-name-space-age=[img=utility/space_age_icon] [color=#8FD18F][font=default-bold]Fuel Stats[/font][/color]: __1__ energy (MJ)
fuel-accel-name-space-age=[img=utility/space_age_icon] [color=#8FD18F][font=default-bold]Fuel Stats[/font][/color]: __1__ acceleration
fuel-speed-name-space-age=[img=utility/space_age_icon] [color=#8FD18F][font=default-bold]Fuel Stats[/font][/color]: __1__ top speed
fuel-energy-description=Fuel value of __1__ in MJ. Vanilla: __2__. (Requires Enable Fuel Stats)
fuel-accel-description=Vehicle acceleration multiplier when burning __1__. Vanilla: __2__. (Requires Enable Fuel Stats)
fuel-speed-description=Vehicle top speed multiplier when burning __1__. Vanilla: __2__. (Requires Enable Fuel Stats)
