fuel-accel-name-space-age=[img=utility/space_age_icon] [color=#8FD18F][font=default-bold]Fuel Stats[/font][/color]: __1__ acceleration
fuel-speed-name-space-age=[img=utility/space_age_icon] [color=#8FD18F][font=default-bold]Fuel Stats[/font][/color]: __1__ top speed
fuel-energy-description=Fuel value of __1__ in MJ. Vanilla: __2__. (Requires Enable Fuel Stats)
fuel-accel-description=Vehicle acceleration multiplier when burning __1__. Vanilla: __2__. (Requires Enable Fuel Stats)
fuel-speed-description=Vehicle top speed multiplier when burning __1__. Vanilla: __2__. (Requires Enable Fuel Stats)
