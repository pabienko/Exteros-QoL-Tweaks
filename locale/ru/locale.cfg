[mod-name]
Exteros-QoL-Tweaks=Exteros QoL System - Tweaks

[mod-description]
Exteros-QoL-Tweaks=Дополнение с настройками к Exteros' QoL System: параметры топлива (энергия, ускорение, макс. скорость), доля возврата переработчика для повышения качества и настройки зарядки робопортов (зарядные станции, масштабируемые по качеству, регулируемая скорость зарядки). Заменяет Adjustable Fuel Stats и Adjustable Recycler. Ничего не меняется, пока не включён соответствующий переключатель.
